const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function keyFrom(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
const loaded=new Promise(r=>document.readyState==='complete'?r():addEventListener('load',()=>setTimeout(r,0)));
async function open_(key){await loaded;const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
const KS='bedi_jsm_key_'+P.salt.slice(0,8);
(async()=>{try{const raw=localStorage.getItem(KS);if(raw){const k=await crypto.subtle.importKey('raw',u8(raw),'AES-GCM',true,['decrypt']);await open_(k)}}catch(e){try{localStorage.removeItem(KS)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');b.disabled=true;er.textContent='';
  try{const k=await keyFrom(document.getElementById('pw').value);
    if(document.getElementById('rem').checked){try{const r=new Uint8Array(await crypto.subtle.exportKey('raw',k));localStorage.setItem(KS,btoa(String.fromCharCode(...r)))}catch(_){}}
    await open_(k)}catch(x){er.textContent='Wrong password.';b.disabled=false}});
</script>
