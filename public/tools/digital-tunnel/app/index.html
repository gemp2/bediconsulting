<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1215"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Digital Tunnel"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body><title>Digital Tunnel</title>
<style>
/* Field app, one screen. Phone: view + bottom tabs + bottom sheet. Tablet ≥820px: left rail + right panel.
   Night-shift palette: ballast blue-black, hi-vis orange for our marks, signal blue for TCMI. Single dark look on purpose. System fonts only (offline, light). */
:root{
  --bg:#0e1215;--surface:#161b1f;--raise:#1f262b;--line:#2c353b;
  --ink:#e9edef;--muted:#97a3aa;--faint:#5f6b72;
  --hv:#ff7a1a;--hv-ink:#1a0d03;--tcmi:#79c2ff;--lm:#c6b6ff;
  --ok:#5fc98a;--part:#f2b14a;--fp:#b996e0;--un:#6b757b;--miss:#ff8a80;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hv);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.1;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#app{position:relative;height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}
main{position:relative;min-height:0}
.view{position:absolute;inset:0;overflow:auto}
.pad{padding-inline:16px;padding-block:14px 24px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:8px 2px 6px;color:var(--muted);font-size:.68rem;font-weight:600;min-height:58px}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--hv)}
.badge{position:relative}
.badge[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;background:var(--hv);color:var(--hv-ink);font-size:.6rem;font-weight:700;border-radius:99px;padding:0 5px;line-height:15px}

/* tunnel */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:1.6rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:42px;height:42px;display:grid;place-items:center;padding:0 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.secs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.sec{flex:none;display:grid;gap:1px;text-align:left;background:var(--raise);border:1px solid var(--line);border-left:4px solid var(--hv);border-radius:10px;padding:9px 14px 9px 11px}
.sec b{font-size:1rem}
.sec span{font-size:.74rem;color:var(--muted)}
.stripbox{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px 2px}
.strip-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#strip{display:block;width:100%;min-width:720px;height:auto}
#strip text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
#strip .big{font-family:var(--body);font-size:13px;font-weight:700;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.72rem;color:var(--muted);padding:4px 2px 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.84rem;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips .c{font-family:var(--mono);font-size:.68rem;opacity:.7;margin-left:4px}
.spots{display:grid;gap:8px}
.card{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px}
.card img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:var(--raise)}
.card .t{font-family:var(--mono);font-size:.74rem;font-weight:600}
.card .d{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap;color:var(--bg)}
.chip.confirmed{background:var(--ok)}.chip.partly{background:var(--part)}.chip.false_positive{background:var(--fp)}.chip.unverified{background:var(--un);color:var(--ink)}

/* 3D */
#v-3d{overflow:hidden;background:#090b0d}
#stage,#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.hud>*{pointer-events:auto}
.seg{display:inline-flex;background:rgba(14,18,21,.88);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 10px;font-size:.8rem;font-weight:600;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.layers{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 90px)}
.layers button{border:1px solid var(--line);background:rgba(14,18,21,.88);border-radius:99px;width:40px;height:40px;display:grid;place-items:center;padding:0}
.layers button[aria-pressed="false"]{opacity:.4}
.layers .sw{width:16px;height:16px;border-radius:4px;display:block}
.dleg{position:absolute;right:10px;bottom:10px;background:rgba(14,18,21,.88);border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-family:var(--mono);font-size:.58rem;color:var(--muted);display:grid;gap:2px}
.dleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:.8rem;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);z-index:2;border:0;padding:0;display:none;place-items:center;font-family:var(--mono);font-weight:700}
.mk.spt{width:34px;height:34px;border-radius:50%;background:var(--hv);color:var(--hv-ink);font-size:.92rem;box-shadow:0 0 0 3px rgba(0,0,0,.5);z-index:4;line-height:34px;text-align:center}
.mk.rila{width:32px;height:32px;border-radius:50%;border:2.5px dashed var(--hv);background:rgba(255,122,26,.18);color:#fff;font-size:.66rem}
.mk.tcmi{background:rgba(9,20,32,.88);border:1px solid var(--tcmi);color:var(--tcmi);border-radius:3px;padding:1px 4px;font-size:.58rem;white-space:nowrap;min-height:18px;z-index:1;font-weight:600}
.mk.lm{width:26px;height:26px;background:var(--lm);color:#140f2a;transform:translate(-50%,-50%) rotate(45deg);border-radius:4px;font-size:.56rem}
.mk.lm span{transform:rotate(-45deg)}
.mk[aria-current="true"]{outline:3px solid #fff;outline-offset:2px}

/* AR */
#v-ar{overflow:hidden}
#mvbox{position:absolute;inset:0}
model-viewer{width:100%;height:100%;background:radial-gradient(circle at 50% 40%,#1d252b,#0b0e10)}
.arbtn{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--hv);color:var(--hv-ink);border:0;border-radius:99px;padding:12px 22px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(14,18,21,.92);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.78rem;color:var(--muted);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;z-index:5;pointer-events:none;transition:opacity .4s}

/* camera */
#v-cam{overflow:hidden;background:#000;touch-action:none}
#camvid,#camfallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ovl{position:absolute;left:50%;top:44%;width:min(92vw,720px);transform-origin:50% 50%;opacity:.8;touch-action:none;user-select:none;-webkit-user-drag:none}
.camtop{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.camtop input{flex:1;min-width:0;accent-color:var(--hv);max-width:220px}
.shutter{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.18);display:grid;place-items:center;padding:0}
.shutter::after{content:"";width:56px;height:56px;border-radius:50%;background:#fff}
.shutter:active::after{background:var(--hv)}
.lastshot{position:absolute;left:18px;bottom:30px;width:52px;height:52px;border-radius:10px;border:2px solid #fff;object-fit:cover;background:var(--raise)}
#filecap{display:none}

/* report */
.rep-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{display:grid;gap:4px;margin-top:14px}
.field label{font-size:.72rem;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.shot{position:relative;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.shot div{padding:6px 8px;font-size:.74rem;display:grid;gap:2px}
.shot .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);font-size:1rem}
.empty{margin-top:14px;padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.86rem;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{border:0;border-radius:10px;padding:13px;font-weight:700;background:var(--raise);border:1px solid var(--line)}
.btn.pri{background:var(--hv);color:var(--hv-ink);border-color:var(--hv)}
.btn:disabled{opacity:.45}

/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:74%;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.55)}
#sheet .grab{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 2px 16px}
#sheet .grab::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
#sheet .x{border:0;background:var(--raise);border-radius:50%;width:34px;height:34px;font-size:1.15rem;line-height:1}
#sheet .body{overflow:auto;padding:0 16px 18px;display:grid;gap:10px;align-content:start}
.sh-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh-h h3{font-size:1.25rem}
.where{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.mapfig{position:relative;line-height:0;border-radius:8px;overflow:hidden;background:#000}
.mapfig img{width:100%;display:block}
.mapfig .bx{position:absolute;border:2.5px solid var(--hv);border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}
.photos figure{margin:0;flex:none;width:62%;max-width:240px;scroll-snap-align:start;position:relative}
.photos button{padding:0;border:0;background:none;display:block;width:100%}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.photos figcaption{position:absolute;left:6px;bottom:6px;display:flex;gap:4px;flex-wrap:wrap}
.photos figcaption span{background:var(--hv);color:var(--hv-ink);font-family:var(--mono);font-size:.7rem;font-weight:700;padding:2px 6px;border-radius:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.86rem}
.kv b{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px}
.mm{display:flex;gap:4px;flex-wrap:wrap}
.mm span{font-family:var(--mono);font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:0 5px}
#lightbox{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.95);display:grid;place-items:center}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}
#lightbox button{position:absolute;top:12px;right:12px;border:0;background:var(--raise);border-radius:50%;width:42px;height:42px;font-size:1.3rem}
#lightbox span{position:absolute;left:12px;bottom:12px;background:var(--hv);color:var(--hv-ink);font-family:var(--mono);font-weight:700;padding:3px 8px;border-radius:4px}
@media (min-width:820px){
  #app{grid-template-columns:78px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  nav.tabs{grid-row:1;grid-column:1;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;border-top:0;border-right:1px solid var(--line);padding-top:10px}
  main{grid-column:2}
  #sheet{left:auto;top:0;width:390px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line)}
  #sheet .grab::before{display:none}
  .pad{padding-inline:24px}
  .spots{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .sheet-open .hud,.sheet-open .dleg{right:400px}
}
</style>

<div id="app">
<main>
  <section class="view" id="v-tunnel" aria-label="Tunnel">
    <div class="pad">
      <div class="top"><div><div class="eyebrow">Chipping Sodbury - BEDI</div><h1>Digital Tunnel</h1></div>
        <button class="iconbtn" id="offline" aria-label="Save for offline use"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button></div>
      <div class="secs" id="secs"></div>
      <div class="stripbox">
        <div class="strip-scroll"><svg id="strip" viewBox="0 0 1000 135" role="img" aria-label="Tunnel strip from portal to portal with every flagged spot"></svg></div>
        <div class="legend"><span><i style="background:var(--ok)"></i>Confirmed</span><span><i style="background:var(--part)"></i>Partly</span><span><i style="background:var(--fp)"></i>Not a defect</span><span><i style="border:1.5px solid var(--un)"></i>No outcome</span></div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter spots"></div>
      <div class="spots" id="spots"></div>
    </div>
  </section>

  <section class="view" id="v-3d" aria-label="Section in 3D" hidden>
    <div id="stage"></div>
    <div id="loading">Loading…</div>
    <div class="hud">
      <div class="seg" id="secsw" role="group" aria-label="Section"></div>
      <div class="seg" id="views3d" role="group" aria-label="View"></div>
    </div>
    <div class="layers" id="layers"></div>
    <div class="dleg" aria-label="Depth classes"><span><i style="background:#ec2929"></i>&gt;80</span><span><i style="background:#ff8c1a"></i>50</span><span><i style="background:#f7d633"></i>20</span><span><i style="background:#40bf59"></i>10</span><span><i style="background:#80858c"></i>mm</span></div>
  </section>

  <section class="view" id="v-ar" aria-label="AR" hidden>
    <div id="mvbox"></div>
    <div class="toast" id="artoast"></div>
  </section>

  <section class="view" id="v-cam" aria-label="Camera" hidden>
    <img id="camfallback" alt="" hidden>
    <video id="camvid" playsinline muted autoplay hidden></video>
    <img id="ovl" src="ts139_overlay.png" alt="Depth map overlay" draggable="false">
    <div class="camtop">
      <div class="seg" id="camsec" role="group" aria-label="Section"></div>
      <input type="range" id="op" min="0" max="1" step="0.05" value="0.8" aria-label="Overlay opacity">
      <button class="iconbtn" id="ovmode" aria-label="Switch overlay"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg></button>
    </div>
    <div class="toast" id="camtoast" style="top:62px"></div>
    <img class="lastshot" id="lastshot" alt="Last photo" hidden>
    <button class="shutter" id="shutter" aria-label="Take photo"></button>
    <input type="file" accept="image/*" capture="environment" id="filecap">
  </section>

  <section class="view" id="v-report" aria-label="Report" hidden>
    <div class="pad">
      <div class="rep-h"><div><div class="eyebrow">Night shift</div><h1 style="font-size:1.6rem" id="reph">Report</h1></div><span class="where" id="repdate"></span></div>
      <div class="field"><label for="insp">Inspector</label><input id="insp" placeholder="Name" autocomplete="name"></div>
      <div class="shots" id="shots"></div>
      <div class="actions"><button class="btn" id="mkpdf">Save PDF</button><button class="btn pri" id="sendpdf">Send by email</button></div>
      <p class="where" style="margin-top:10px" id="repnote"></p>
    </div>
  </section>

  <aside id="sheet" hidden aria-label="Details"><div class="grab"><span class="eyebrow" id="shk"></span><button class="x" id="shx" aria-label="Close">×</button></div><div class="body" id="shb"></div></aside>
  <div id="lightbox" hidden><img alt=""><span hidden></span><button aria-label="Close photo">×</button></div>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-v="tunnel"><svg viewBox="0 0 24 24"><path d="M3 20V11a9 9 0 0 1 18 0v9"/><path d="M3 20h18M8 20v-4M12 20v-4M16 20v-4"/></svg>Tunnel</button>
  <button data-v="3d"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>3D</button>
  <button data-v="ar"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M12 7l5 2.8v4.4L12 17l-5-2.8V9.8z"/></svg>AR</button>
  <button data-v="cam"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</button>
  <button data-v="report"><span class="badge" id="repbadge" data-n="0"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h6M10 16h6"/></svg></span>Report</button>
</nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
